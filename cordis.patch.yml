# dsh-lm-memory —— Living Memory 全家桶挂载声明（npm/GitHub 包形态）
# 默认数据目录由 DSH_HOME/系统用户目录定位；MCP 等待插件验证 Node 并写好稳定 shim。
# 平台无关（macOS / Windows / Linux）。注意：bundle 层只应用 insert: 块内的条目。
- insert:
    - id: dsh-lm-memory
      name: dsh-lm-memory
      config:
        minUserMessages: 2
        memoryDir: !!js process.getBuiltinModule('node:path').join(process.env.DSH_HOME ?? process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.dsh'), 'memory')
        viewer: 7640
        # llm: 可选，提炼/摘要用的模型（不配则默认「跟随会话模型」；显式 model 一旦设置即接管）
        # llm:
        #   model: glm-5.3
        #   baseURL: ""
        #   apiKeyEnv: ZAI_CODING_CN_API_KEY
        # 已知可映射 provider：zai-coding-cn / deepseek-official / deepseek-api-key / agnes
        #
        # 以下是默认关闭的候选能力，需要时取消对应注释（细节见 docs/project-memory.md）：
        # projectMemory: true      # 按 Git 仓库隔离的项目记忆；开启后不再启动旧 MCP/旧采集/Viewer
        # confirmedOutcomes: true  # 配合 projectMemory：允许用「确认结论：/确认修复：」把上一轮助手原句存为项目事实/经验
        # allowRemote: true        # 配合 projectMemory：允许把复盘作业交给模型提炼（默认不外发）
        # taskRecall:              # 实验：任务相关候选编号提示，需同时列精确会话 ID
        #   enabled: true
        #   sessionIds:
        #     - session-替换为测试会话的准确ID
    - id: mcp-lm-memory
      name: '@deepseek-ai/dsh-mcp-client'
      inject: [lmMemoryStartup]
      config:
        serverName: lm_memory
        transport: stdio
        command: !!js ctx.lmMemoryStartup.node
        args:
          - !!js ctx.lmMemoryStartup.shimPath
        env:
          LM_MEMORY_DIR: !!js ctx.lmMemoryStartup.memoryDir
