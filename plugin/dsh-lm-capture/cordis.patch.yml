# dsh-lm-capture —— Living Memory 全家桶自带挂载声明
# 注意：bundle 层只应用 insert: 块内的条目，裸条目会被静默忽略（血泪教训）
- insert:
    - id: dsh-lm-capture
      name: dsh-lm-capture
      config:
        minUserMessages: 2
        memoryDir: /Users/huangruibang/.dsh/memory
        viewer: 7640
    - id: mcp-lm-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: lm_memory
        transport: stdio
        command: node
        args:
          - /Users/huangruibang/.dsh/memory/server/memory-server.mjs
        env:
          LM_MEMORY_DIR: /Users/huangruibang/.dsh/memory
